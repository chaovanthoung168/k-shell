[package]
name = "kshell"
version = "0.1.1"
edition = "2024"
description = "K Shell, a native Windows shell built incrementally in Rust"
license = "MIT"

[dependencies]
rustyline = { version = "19", default-features = false, features = ["with-file-history", "custom-bindings"] }
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Com", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Native isolated-console and junction-fixture tests; no additional crate.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices"] }
