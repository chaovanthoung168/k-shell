name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check version tag
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match Cargo.toml version.' }
      - name: Prepare stable Rust
        run: |
          rustup toolchain install stable --profile default
          if ($LASTEXITCODE) { throw 'Rust installation failed.' }
          rustup default stable
          cargo fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { throw 'Locked dependency download failed.' }
      - name: Check Rust
        run: |
          cargo fmt --check
          if ($LASTEXITCODE) { throw 'Formatting check failed.' }
          cargo test --locked --offline
          if ($LASTEXITCODE) { throw 'Tests failed.' }
          cargo clippy --locked --offline --all-targets -- -D warnings
          if ($LASTEXITCODE) { throw 'Clippy failed.' }
      - name: Build and check Windows package
        run: |
          ./scripts/Build-Release.ps1
          $archive = (Get-ChildItem target/packages/KShell-*-windows-x64.zip).FullName
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/Test-Distribution.ps1 -Archive $archive
          if ($LASTEXITCODE) { throw 'Windows PowerShell package checks failed.' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/Test-Installer.ps1 -Archive $archive
          if ($LASTEXITCODE) { throw 'Windows PowerShell installer checks failed.' }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem target/packages/KShell-*-windows-x64.zip* | ForEach-Object FullName)
          if ($assets.Count -ne 2) { throw 'Expected the ZIP and SHA256 file.' }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "K Shell $env:GITHUB_REF_NAME" --notes-file contrib/distribution/RELEASE.md --latest
          if ($LASTEXITCODE) { throw 'Release publication failed.' }
